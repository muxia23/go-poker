services:
  go-poker:
    build: .
    container_name: go-poker
    restart: unless-stopped
    ports:
      - 8080:8080
    environment:
      DATABASE_URL: sqlite:/data/poker.db
      # only used on first start, to create root; you must change the password at first login
      ROOT_USERNAME: root
      ROOT_PASSWORD: change-me-now
    volumes:
      - poker-data:/data

volumes:
  poker-data:
